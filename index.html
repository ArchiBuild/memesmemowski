<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Papież Chaos</title>

<style>
body {
  background: white;
  overflow: hidden;
  margin: 0;
  font-family: Arial, sans-serif;
  transition: background 0.1s linear;
}

#info {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 20px;
  font-size: 28px;
  z-index: 10;
}

#flash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 1000;
}

.maly {
  position: absolute;
  width: 40px;
  pointer-events: none;
}
</style>
</head>

<body>

<h1 id="info"></h1>

<audio id="muzyka" src="https://files.catbox.moe/bq8d6t.mp3" loop></audio>
<audio id="boom" src="https://files.catbox.moe/e65w9f.mp3"></audio>

<div id="flash"></div>

<script>
let currentMode = "papiez";
let klikniecia = 0;
let moveInterval;
let glitchInterval;
let backgroundInterval;

const muzyka = document.getElementById("muzyka");
const boom = document.getElementById("boom");
const info = document.getElementById("info");
const flash = document.getElementById("flash");

/* START */
startPapiez();

/* PAPIEŻ */
function startPapiez() {
  resetScreen();
  currentMode = "papiez";
  klikniecia = 0;

  info.innerText = "Kliknij trzy razy w papieża";
  info.style.display = "block";

  createMainImage(
    "https://i.ibb.co/4Rh6vwS9/PAPIEZ-2.png",
    300
  );
}

/* KREMÓWKA */
function startKremowka() {
  resetScreen();
  currentMode = "kremowka";
  klikniecia = 0;

  info.innerText = "Kliknij trzy razy w kremówkę";
  info.style.display = "block";

  createMainImage(
    "https://i.ibb.co/bjy7SGwm/OIP.webp",
    220
  );
}

/* TWORZENIE GŁÓWNEGO OBRAZU */
function createMainImage(src, size) {
  const img = document.createElement("img");
  img.id = "main";
  img.src = src;
  img.style.width = size + "px";
  img.style.position = "absolute";
  img.style.left = "50%";
  img.style.top = "50%";
  img.style.transform = "translate(-50%, -50%)";
  img.style.cursor = "pointer";

  document.body.appendChild(img);

  img.addEventListener("click", () => {
    klikniecia++;
    if (klikniecia === 3) {
      info.style.display = "none";
      startChaos(img, src);
    }
  });
}

/* CHAOS */
function startChaos(img, src) {

  muzyka.volume = 1;
  muzyka.play();

  startFlashingBackground();

  let x = window.innerWidth / 2;
  let y = window.innerHeight / 2;
  let dx = 20;
  let dy = 20;

  moveInterval = setInterval(() => {
    x += dx;
    y += dy;

    if (x <= 0 || x >= window.innerWidth - img.offsetWidth) dx *= -1;
    if (y <= 0 || y >= window.innerHeight - img.offsetHeight) dy *= -1;

    img.style.left = x + "px";
    img.style.top = y + "px";
  }, 16);

  setTimeout(() => startTrail(img), 5000);

  setTimeout(() => {
    explosion(img, src);
  }, 15000);
}

/* DUCHY */
function startTrail(img) {
  glitchInterval = setInterval(() => {
    const clone = img.cloneNode(true);
    clone.style.position = "absolute";
    clone.style.left = img.style.left;
    clone.style.top = img.style.top;
    clone.style.opacity = 0.4;
    clone.style.pointerEvents = "none";
    document.body.appendChild(clone);
    setTimeout(() => clone.remove(), 1500);
  }, 40);
}

/* WYBUCH */
function explosion(img, src) {

  clearInterval(moveInterval);
  clearInterval(glitchInterval);

  boom.currentTime = 0;
  boom.play();

  flash.style.opacity = "1";
  setTimeout(() => flash.style.opacity = "0", 120);

  img.remove();

  startRain(src);
  startSide(src);

  setTimeout(() => {
    if (currentMode === "papiez") {
      startKremowka();
    } else {
      startPapiez();
    }
  }, 6000);
}

/* DESZCZ */
function startRain(src) {
  const rain = setInterval(() => {
    const mini = document.createElement("img");
    mini.src = src;
    mini.className = "maly";
    mini.style.left = Math.random() * window.innerWidth + "px";
    mini.style.top = "-50px";
    document.body.appendChild(mini);

    let posY = -50;
    let speed = 5 + Math.random() * 8;

    const fall = setInterval(() => {
      posY += speed;
      mini.style.top = posY + "px";
      if (posY > window.innerHeight) {
        mini.remove();
        clearInterval(fall);
      }
    }, 16);
  }, 40);

  setTimeout(() => clearInterval(rain), 5000);
}

/* ATAK Z BOKU */
function startSide(src) {
  const side = setInterval(() => {
    const flat = document.createElement("img");
    flat.src = src;
    flat.style.position = "absolute";
    flat.style.top = Math.random() * window.innerHeight + "px";
    flat.style.left = "-400px";
    flat.style.transform = "scaleX(2.5) scaleY(0.3)";
    flat.style.width = "250px";
    document.body.appendChild(flat);

    let posX = -400;
    const fly = setInterval(() => {
      posX += 40;
      flat.style.left = posX + "px";
      if (posX > window.innerWidth + 400) {
        flat.remove();
        clearInterval(fly);
      }
    }, 16);
  }, 120);

  setTimeout(() => clearInterval(side), 5000);
}

/* TĘCZOWE TŁO */
function startFlashingBackground() {
  clearInterval(backgroundInterval);
  backgroundInterval = setInterval(() => {
    document.body.style.background =
      "hsl(" + Math.random() * 360 + ", 100%, 50%)";
  }, 80);
}

/* RESET */
function resetScreen() {
  document.querySelectorAll("#main").forEach(e => e.remove());
  document.querySelectorAll(".maly").forEach(e => e.remove());
  document.body.style.background = "white";
}
</script>

</body>
</html>
